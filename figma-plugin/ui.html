<div style="font-family:Inter,system-ui,sans-serif;font-size:12px;display:flex;flex-direction:column;gap:10px;padding:4px">
  <b style="font-size:13px">Ligar os ecrãs do protótipo Anda</b>
  <div>1. Importe a galeria com o html.to.design.<br>2. Selecione a frame importada (ou nada, para usar a página toda).<br>3. Escolha o ficheiro <code>anda-ligacoes-*.json</code> descarregado da galeria.</div>
  <input type="file" id="f" accept=".json">
  <button id="go" disabled style="padding:8px;background:#303f9f;color:#fff;border:0;border-radius:6px;font-weight:600">Ligar ecrãs</button>
  <pre id="out" style="white-space:pre-wrap;max-height:220px;overflow:auto;background:#f3f3f7;padding:6px;margin:0"></pre>
</div>
<script>
  let data = null;
  document.getElementById('f').onchange = async e => {
    data = JSON.parse(await e.target.files[0].text());
    document.getElementById('out').textContent = data.frames.length + ' ecrãs e ' + data.links.length + ' ligações no ficheiro.';
    document.getElementById('go').disabled = false;
  };
  document.getElementById('go').onclick = () => parent.postMessage({ pluginMessage: { type: 'link', data } }, '*');
  onmessage = e => { const m = e.data.pluginMessage; if (m) document.getElementById('out').textContent = m; };
</script>
